# Include this file in the nginx http {} context (for example conf.d/).
# Keep your existing TLS listener/certificates. Change ONLY the two origins and
# server_name/listen below. This example uses host-local published ports, so
# nginx can start/reload even if the Helper container does not exist.
map $http_upgrade $helper_connection_upgrade {
    default upgrade;
    '' close;
}

map $http_accept $helper_document_accept {
    default 0;
    # Conservatively bypass injection if either HTML media range is disabled.
    "~*(?:text/html|application/xhtml\+xml)[^,]*;\s*q\s*=\s*(?:0(?:\.0*)?|\.0+)\s*(?:[,;]|$)" 0;
    ~*text/html 1;
    ~*application/xhtml\+xml 1;
}

map $http_sec_fetch_dest $helper_document_destination {
    default 0;
    '' 1; # Older browsers may omit Fetch Metadata.
    document 1;
    iframe 1;
}

map $http_upgrade $helper_document_no_upgrade {
    default 0;
    '' 1;
}

map $http_sec_websocket_key $helper_document_no_websocket_key {
    default 0;
    '' 1;
}

# Audited against upstream v0.2.22 gateway.go and embedded-frontend bypasses.
# A new upstream route needs review before optional injection is enabled.
map $uri $helper_document_route {
    default 1;
    ~^/(?:_helper|api|v1|v1beta|backend-api|antigravity|assets|static|fonts|src|contents|v3|live|systemone|ready|readyz|readiness|liveness|metrics|docs|redoc)(?:/|$) 0;
    /openapi.json 0;
    ~^/\.well-known(?:/|$) 0;
    ~^/(?:health|healthz|models|responses|embeddings|realtime|tts|stt|web_search|x_search|custom-voices)(?:/|$) 0;
    ~^/(?:images|videos)(?:/|$) 0;
    ~^/(?:chat/completions|messages/count_tokens|alpha/search)(?:/|$) 0;
    ~^/(?:contents/generations/tasks|v3/contents/generations/tasks)(?:/|$) 0;
    ~^/setup/ 0;
    ~*\.(?:css|js|mjs|map|json|webmanifest|ico|png|jpe?g|gif|webp|svg|avif|woff2?|ttf|otf|txt|xml|pdf|zip|gz|mp4|webm|mp3|wav)$ 0;
}

map "$helper_injection_enabled:$request_method:$helper_document_accept:$helper_document_route:$helper_document_destination:$helper_document_no_upgrade:$helper_document_no_websocket_key" $helper_document_target {
    default @sub2api_original;
    "1:GET:1:1:1:1:1" @helper_document;
}

server {
    listen 80;
    server_name sub2api.example.com;

    set $sub2api_origin http://127.0.0.1:8080;
    set $helper_origin http://127.0.0.1:18080;
    # DEFAULT: original site has no runtime dependency on Helper.
    # Beta opt-in requires this value=1 AND HELPER_NATIVE_UI=true on Helper.
    set $helper_injection_enabled 0;

    client_max_body_size 0;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $helper_connection_upgrade;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # In particular, never retry model POSTs or an already-started SSE stream.
    proxy_next_upstream off;
    # Embedded feature links may carry a JWT. Do not log query strings.
    access_log off;

    location ^~ /_helper/ {
        proxy_connect_timeout 1s;
        proxy_pass $helper_origin$request_uri;
    }

    location / {
        # There is deliberately no local file tree here. The final variable is
        # a named location, selected by the method/Accept/path maps above.
        root /var/empty/helper-ingress-no-files;
        try_files /__helper_dispatch_no_file__ $helper_document_target;
    }

    location @sub2api_original {
        proxy_pass $sub2api_origin$request_uri;
    }

    location @helper_document {
        # Only document GETs reach this location. Business POSTs never do.
        proxy_connect_timeout 1s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 404 502 503 504 = @sub2api_original;
        proxy_pass $helper_origin$request_uri;
    }
}
