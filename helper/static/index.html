<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>sub2api Helper · 管理助手</title>
  <script src="/static/icons.js" defer></script>
  <script src="/static/benchmark-results.js" defer></script>
  <script src="/static/gallery-view.js" defer></script>
  <script src="/static/gallery-admin.js" defer></script>
  <script src="/static/app.js" defer></script>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/benchmark-results.css">
  <link rel="stylesheet" href="/static/gallery-view.css">
  <link rel="stylesheet" href="/static/gallery-admin.css">
</head>
<body class="embedded">
  <div class="embed-shell">
    <section class="connection-card" aria-label="连接 sub2api">
      <form id="connection-form" class="connection-form">
        <label class="connection-field"><span>sub2api 服务地址</span><input id="connection-url" name="url" type="url" required placeholder="https://sub2api.example.com" autocomplete="url"></label>
        <label class="connection-field"><span>管理员 API Key</span><input id="connection-key" name="admin_key" type="password" required placeholder="输入 sub2api 管理员 API Key" autocomplete="off" spellcheck="false"></label>
        <button id="connect" class="button primary" type="submit">连接服务</button>
        <button id="disconnect" class="button ghost" type="button" hidden>断开连接</button>
        <span id="connection-badge" class="pill">未连接</span>
      </form>
      <div id="connection-feedback" class="connection-feedback" role="status" aria-live="polite">填写管理员 API Key 后即可管理。断开浏览器连接不会停止已保存的后台任务。</div>
    </section>
    <nav id="navigation" class="tabs-nav" aria-label="助手功能"></nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="editor" class="editor-dialog"></dialog>
</body>
</html>
