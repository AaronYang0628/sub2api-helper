name: Sync upstream releases
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upstream.yaml'
      - '.github/upstream-sync-request'
      - 'scripts/watch_upstream.py'
      - 'scripts/sync_upstream_release.py'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: upstream-release-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: helper
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Find the next official stable release
        id: discover
        working-directory: helper
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python scripts/watch_upstream.py discover --repository "$REPOSITORY" \
            --default-branch "$DEFAULT_BRANCH" --outputs "$GITHUB_OUTPUT" \
            --release-json "$RUNNER_TEMP/upstream-release.json"
      - name: Checkout the exact release tag as data
        if: steps.discover.outputs.found == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Wei-Shaw/sub2api
          ref: ${{ steps.discover.outputs.tag }}
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch the reviewed tree for a direct comparison
        if: steps.discover.outputs.found == 'true'
        working-directory: upstream
        env:
          UPSTREAM_TAG: ${{ steps.discover.outputs.tag }}
        run: |
          REVIEWED_SHA=$(python -c 'import json,re; s=json.load(open("../helper/docs/upstream-baseline.json"))["reviewed_commit"]; assert re.fullmatch("[0-9a-f]{40}",s); print(s)')
          git fetch --depth=1 --no-tags origin "$REVIEWED_SHA"
          git fetch --depth=1 origin "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG"
      - name: Prepare version, compatibility evidence and PR body
        if: steps.discover.outputs.found == 'true'
        id: prepare
        working-directory: helper
        run: |
          python scripts/sync_upstream_release.py prepare \
            --release-json "$RUNNER_TEMP/upstream-release.json" --source ../upstream \
            --outputs "$GITHUB_OUTPUT"
          python scripts/watch_upstream.py body --manifest docs/upstream-release.json \
            --out "$RUNNER_TEMP/upstream-pr.md"
      - name: Create a PR even if no application adjustment is needed
        if: steps.discover.outputs.found == 'true'
        id: pr
        working-directory: helper
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SYNC_BRANCH: ${{ steps.prepare.outputs.branch }}
          UPSTREAM_TAG: ${{ steps.prepare.outputs.tag }}
          REQUIRES_REVIEW: ${{ steps.prepare.outputs.requires_review }}
        run: |
          python scripts/open_sync_pr.py --repository "$REPOSITORY" \
            --base "$DEFAULT_BRANCH" --branch "$SYNC_BRANCH" \
            --title "chore: sync sub2api $UPSTREAM_TAG" \
            --body-file "$RUNNER_TEMP/upstream-pr.md" --root . \
            --draft "$REQUIRES_REVIEW" --outputs "$GITHUB_OUTPUT"
      - name: Explicitly dispatch CI for the bot-created PR
        if: steps.pr.outputs.pull_request_number != ''
        working-directory: helper
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SYNC_BRANCH: ${{ steps.prepare.outputs.branch }}
        run: gh workflow run ci.yaml --repo "$REPOSITORY" --ref "$SYNC_BRANCH"
