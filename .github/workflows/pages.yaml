name: Deploy GitHub Pages demo

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'helper/static/**'
      - 'helper/VERSION'
      - '.github/workflows/pages.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-demo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Build the static, fixture-only demo
        run: node site/build.mjs
      # Package the Pages artifact directly: upload-pages-artifact is composite
      # and currently references a floating nested action, blocked by this repo.
      - name: Package the Pages artifact
        run: |
          tar --dereference --hard-dereference \
            --directory _site --exclude=.git --exclude=.github \
            -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 7
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # First enable Pages in repository Settings > Pages > Source: GitHub Actions.
      # GITHUB_TOKEN can deploy, but cannot grant itself initial site-admin access.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish the demo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Explain first-time Pages setup after a deployment failure
        if: failure()
        run: |
          {
            echo '## Pages deployment needs attention'
            echo 'The build job retains the generated static-site artifact for review.'
            echo 'For a new site, open Settings → Pages and select Source: GitHub Actions, then rerun this workflow.'
            echo 'Settings: https://github.com/AaronYang0628/sub2api-helper/settings/pages'
            echo 'If Pages is already enabled, inspect the failed deployment step for the specific cause.'
          } >> "$GITHUB_STEP_SUMMARY"
